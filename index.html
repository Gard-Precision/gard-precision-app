<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gard Precision | OS v45.3 | Full-Spectrum Production</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* V45.3 ULTRA-DENSITY STYLING 
           Industrial-Grade CSS Architecture: Neon Glassmorphism & High-Contrast Readability
        */
        :root { 
            --p: #000b1e; --o: #f97316; --b: #0084ff; --g: #00f2ff; 
            --t: #ffffff; --r: #ff3b3b; --bg: #000814; 
            --glass: rgba(0, 26, 61, 0.92);
            --neon: 0 0 25px rgba(0, 242, 255, 0.5);
            --panel-border: 1px solid rgba(0, 242, 255, 0.25);
            --accent-gradient: linear-gradient(135deg, var(--b), var(--g));
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; transition: all 0.25s cubic-bezier(0.15, 0.85, 0.15, 1); }
        
        body { 
            background: var(--bg); 
            background-image: 
                radial-gradient(circle at 50% 30%, #001a3d 0%, #000814 100%),
                linear-gradient(rgba(0, 132, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 132, 255, 0.04) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: var(--t); 
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; 
            margin: 0; min-height: 100vh; overflow-x: hidden; 
        }

        /* Tactical HUD Header */
        .top-bar { 
            background: rgba(0,0,0,0.95); padding: 15px 30px; font-size: 11px; 
            color: var(--g); border-bottom: 2px solid #1e293b; 
            text-transform: uppercase; letter-spacing: 4px; font-weight: 900; 
            display: flex; justify-content: space-between; position: sticky; 
            top: 0; z-index: 1000; backdrop-filter: blur(20px);
        }

        .header { padding: 70px 20px 50px; text-align: center; }
        .header h1 { 
            margin: 0; letter-spacing: 20px; font-weight: 900; 
            font-size: clamp(30px, 8vw, 48px); text-transform: uppercase; 
            text-shadow: 0 0 40px rgba(0, 132, 255, 0.8);
            background: linear-gradient(180deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-tag { 
            color: var(--o); font-size: 12px; font-weight: 800; 
            margin-top: 20px; text-transform: uppercase; letter-spacing: 10px; 
            border-top: 2px solid var(--o); display: inline-block; padding-top: 15px;
            text-shadow: 0 0 10px rgba(249, 115, 22, 0.5);
        }

        /* High-Visibility Navigation */
        .nav-dock { 
            display: flex; overflow-x: auto;
            background: #000; border-bottom: 1px solid #334155; 
            position: sticky; top: 43px; z-index: 900; 
        }
        .nav-item { 
            flex: 1; min-width: 80px;
            padding: 28px 0; cursor: pointer; color: #475569; border: none; 
            background: none; font-size: 11px; font-weight: 900; 
            text-transform: uppercase; letter-spacing: 3px; 
            border-bottom: 5px solid transparent; text-align: center;
        }
        .nav-item.active { 
            color: #fff; background: rgba(0, 132, 255, 0.25); 
            border-bottom-color: var(--b); text-shadow: var(--neon);
        }

        .app-canvas { padding: 50px 20px; max-width: 720px; margin: auto; animation: systemReady 0.7s ease-out; }
        @keyframes systemReady { from { opacity: 0; filter: blur(10px); transform: translateY(40px); } to { opacity: 1; filter: blur(0); transform: translateY(0); } }

        /* Industrial Module Containers */
        .module { 
            background: var(--glass); padding: 40px; border-radius: 28px; 
            border: var(--panel-border); margin-bottom: 40px; 
            box-shadow: 0 30px 80px rgba(0,0,0,0.85); backdrop-filter: blur(30px);
            position: relative;
        }
        .module::before { content: ""; position: absolute; top: 15px; right: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--g); box-shadow: 0 0 10px var(--g); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        
        .label { font-size: 12px; text-transform: uppercase; letter-spacing: 4px; color: var(--g); font-weight: 900; margin-bottom: 20px; display: block; border-left: 3px solid var(--b); padding-left: 10px; }
        
        input, select, textarea { 
            width: 100%; padding: 22px; margin: 15px 0; 
            background: rgba(0,0,0,0.75); border: 1px solid #475569; 
            color: #fff; border-radius: 16px; font-size: 16px; 
            outline: none; font-family: 'JetBrains Mono', 'Consolas', monospace;
        }
        input:focus { border-color: var(--g); background: rgba(0,0,0,0.95); box-shadow: var(--neon); }
        input[type="range"] { padding: 0; height: 5px; background: #334155; border: none; -webkit-appearance: none; margin: 20px 0; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--g); box-shadow: var(--neon); cursor: pointer; }
        input[type="file"] { padding: 10px; background: rgba(255,255,255,0.05); }

        /* Tactical Button Profiles */
        .btn { 
            width: 100%; padding: 24px; border: none; border-radius: 16px; 
            font-weight: 900; cursor: pointer; text-transform: uppercase; 
            letter-spacing: 5px; margin-top: 20px; display: flex; 
            align-items: center; justify-content: center; text-decoration: none;
            box-shadow: 0 12px 35px rgba(0,0,0,0.5);
        }
        .btn-primary { background: var(--accent-gradient); color: #fff; border-bottom: 4px solid #0056b3; }
        .btn-accent { background: linear-gradient(135deg, var(--g), #0ea5e9); color: #000; border-bottom: 4px solid #008ca3; }
        .btn-danger { background: rgba(255, 59, 59, 0.12); border: 2px solid var(--r); color: var(--r); }
        .btn-small { width: auto; padding: 10px 15px; margin-top: 0; font-size: 10px; }
        .btn:hover { transform: translateY(-5px) scale(1.02); filter: brightness(1.1); }
        .btn:active { transform: translateY(2px); }

        /* Data Visualization Modules */
        .ledger { 
            max-height: 500px; overflow-y: auto; background: rgba(0,0,0,0.65); 
            padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); 
            font-family: 'JetBrains Mono', monospace; font-size: 14px; 
        }
        .entry { border-bottom: 1px solid rgba(255,255,255,0.04); padding: 20px 0; display: flex; justify-content: space-between; align-items: center; }
        
        .progress-container { width: 100%; height: 28px; background: rgba(0,0,0,0.6); border-radius: 60px; margin: 30px 0; overflow: hidden; border: 2px solid #1e293b; padding: 5px; }
        .progress-fill { height: 100%; border-radius: 60px; background: var(--accent-gradient); box-shadow: 0 0 25px var(--g); position: relative; transition: width 0.4s ease; }
        .progress-fill::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); animation: sweep 3s infinite; }
        @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
        
        .badge { padding: 10px 20px; border-radius: 12px; font-size: 11px; font-weight: 900; letter-spacing: 2px; }

        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-panel { background: rgba(255,255,255,0.04); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); text-align: center; }

        .shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .shop-card { background: rgba(0,0,0,0.8); border: 1px solid #334155; border-radius: 12px; overflow: hidden; text-align: center; padding-bottom: 15px; }
        .shop-img { width: 100%; height: 120px; object-fit: cover; background: #1e293b; border-bottom: 1px solid var(--g); }
        
        .chat-box { height: 250px; overflow-y: auto; background: rgba(0,0,0,0.8); border: 1px solid #334155; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
        .msg { max-width: 80%; padding: 12px 15px; border-radius: 15px; font-size: 12px; line-height: 1.4; word-wrap: break-word; }
        .msg.admin { align-self: flex-start; background: rgba(0, 132, 255, 0.2); border-left: 2px solid var(--b); border-bottom-left-radius: 2px; }
        .msg.client { align-self: flex-end; background: rgba(249, 115, 22, 0.2); border-right: 2px solid var(--o); border-bottom-right-radius: 2px; }
        .msg-time { font-size: 8px; opacity: 0.5; margin-top: 5px; display: block; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--b); border-radius: 10px; }
    </style>
</head>
<body onload="bootSystem()">

    <div class="top-bar">
        <span>GARD PRECISION // INFRASTRUCTURE_OS v45.3</span>
        <span id="sys-clock">00:00:00 AM</span>
    </div>

    <div class="header">
        <h1>GARD PRECISION</h1>
        <div class="header-tag">Industrial Production Architecture</div>
    </div>

    <nav class="nav-dock">
        <button id="t-shop" class="nav-item" onclick="navigate('shop')">Shop</button>
        <button id="t-portal" class="nav-item" onclick="navigate('portal')">Client</button>
        <button id="t-audit" class="nav-item" onclick="navigate('audit')">Audit</button>
        <button id="t-crew" class="nav-item" onclick="navigate('crew')">Crew</button>
        <button id="t-functionality" class="nav-item" onclick="navigate('functionality')">Systems</button>
        <button id="t-admin" class="nav-item" onclick="navigate('gate')">CEO GARD</button>
    </nav>

    <main id="app-root" class="app-canvas"></main>

    <script>
        /* V45.3 KERNEL LOGIC 
           Includes Phase Matrix, Time & Attendance, IndexedDB Photo Vault
        */
        const BASE_PAY_URL = "https://square.link/u/m66E40D7";
        const DUE_PAY_URL = "https://square.link/u/AqVdW7ZW";

        // --- INDEXED DB STORAGE VAULT ---
        let db;
        const request = indexedDB.open("GardPhotoVault", 1);
        request.onupgradeneeded = event => {
            db = event.target.result;
            if(!db.objectStoreNames.contains("photos")) {
                db.createObjectStore("photos");
            }
        };
        request.onsuccess = event => {
            db = event.target.result;
            loadShopImagesFromVault();
        };

        function savePhotoToVault(id, dataUrl) {
            if(!db) return;
            const tx = db.transaction("photos", "readwrite");
            tx.objectStore("photos").put(dataUrl, id);
        }

        function loadShopImagesFromVault() {
            if(!db) return;
            const tx = db.transaction("photos", "readonly");
            const store = tx.objectStore("photos");
            gpStore.shop.forEach(item => {
                if(item.imgId) {
                    const req = store.get(item.imgId);
                    req.onsuccess = e => {
                        item.img = e.target.result; 
                        if(currentActiveScreen === 'shop') renderShop(document.getElementById('app-root'));
                    };
                }
            });
        }

        let gpStore = JSON.parse(localStorage.getItem('gp_v45_final')) || JSON.parse(localStorage.getItem('gp_v44_final')) || {
            meta: { revenueGoal: 10000, manualCredits: 0, subCost: 199.00 },
            clients: [],
            inventory: [],
            shop: [],
            employees: [],
            productionLogs: [],
            materials: [
                {n: "T6-Core Housing", c: 210.00, stock: 45}, 
                {n: "Titanium Rail G5", c: 185.00, stock: 12}, 
                {n: "RF-Poly Shield", c: 340.00, stock: 8}
            ],
            session: { user: null, role: null, attempts: 0, log: [] },
            phases: ["Not Started", "Started", "In Progress", "On Lunch", "Clocked Out", "Completed"], // Default custom phases
            timeClock: [] // Accounting logs
        };

        // Data Migration & Structural Patch
        gpStore.clients.forEach(c => { 
            if(!c.jobs) c.jobs = []; 
            if(!c.messages) c.messages = []; 
            c.jobs.forEach(j => { 
                if(!j.assignedTo) j.assignedTo = "Unassigned"; 
                if(j.phaseIdx === undefined) j.phaseIdx = 0; // Migrate old progress to phase index
            });
        });
        if(!gpStore.shop) gpStore.shop = [];
        if(!gpStore.employees) gpStore.employees = [];
        if(!gpStore.phases) gpStore.phases = ["Not Started", "Started", "In Progress", "On Lunch", "Clocked Out", "Completed"];
        if(!gpStore.timeClock) gpStore.timeClock = [];
        gpStore.employees.forEach(e => { if(!e.pin) e.pin = "0000"; });

        // Global States
        let currentActiveScreen = 'portal';
        let sysUnlocked = false; 
        let targetSecureRoute = '';

        function bootSystem() {
            updateTime(); setInterval(updateTime, 1000);
            logAction("KERNEL_INITIALIZED_V45.3_SUCCESS");
            navigate('portal'); // System defaults to Client Portal on load
        }

        function updateTime() { document.getElementById('sys-clock').innerText = new Date().toLocaleTimeString(); }
        function sync() { 
            let safeStore = JSON.parse(JSON.stringify(gpStore));
            safeStore.shop.forEach(item => { if(item.imgId) delete item.img; }); 
            localStorage.setItem('gp_v45_final', JSON.stringify(safeStore)); 
        }
        
        function logAction(msg) {
            gpStore.session.log.unshift(`[${new Date().toLocaleTimeString()}] ${msg}`);
            if(gpStore.session.log.length > 75) gpStore.session.log.pop();
            sync();
        }

        function navigate(view) {
            const secureViews = ['admin', 'functionality'];
            
            if (secureViews.includes(view) && !sysUnlocked) {
                targetSecureRoute = view;
                view = 'gate';
            }

            currentActiveScreen = (view === 'gate') ? targetSecureRoute : view; 

            const root = document.getElementById('app-root');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            
            const activeBtn = document.getElementById('t-' + (view === 'gate' ? targetSecureRoute : view));
            if(activeBtn) activeBtn.classList.add('active');

            if(view === 'gate') renderGate(root);
            else if(view === 'shop') renderShop(root);
            else if(view === 'portal') renderPortal(root);
            else if(view === 'audit') renderAudit(root);
            else if(view === 'crew') renderCrew(root);
            else if(view === 'functionality') renderFunctionality(root);
            else if(view === 'admin') renderAdmin(root);
            
            root.style.animation = 'none';
            root.offsetHeight; 
            root.style.animation = 'systemReady 0.5s ease-out';
        }

        function renderGate(root) {
            root.innerHTML = `
                <div class="module" style="border-color: var(--r);">
                    <span class="label" style="color:var(--r); border-color:var(--r);">Security Protocol Active</span>
                    <p style="font-size:13px; color:#94a3b8; margin-bottom:25px; line-height:1.6;">Requested module requires CEO decryption.</p>
                    <input type="password" id="key-input" placeholder="ENTER SYSTEM KEY" autofocus>
                    <button class="btn btn-accent" onclick="validateKey()">DECRYPT & AUTHORIZE</button>
                    ${gpStore.session.attempts >= 2 ? `<button class="btn btn-danger" style="margin-top:25px; font-size:11px;" onclick="sysUnlocked=true; navigate(targetSecureRoute)">KERNEL EMERGENCY BYPASS</button>` : ''}
                </div>`;
            
            // Allow pressing Enter to submit
            setTimeout(() => {
                const input = document.getElementById('key-input');
                if(input) input.onkeydown = (e) => { if(e.key === "Enter") validateKey(); };
            }, 50);
        }

        function validateKey() {
            // Trim added to prevent accidental spacebar lockouts
            if(document.getElementById('key-input').value.trim() === "Argon6098") {
                gpStore.session.attempts = 0; sysUnlocked = true; logAction("CEO_ACCESS_GRANTED"); navigate(targetSecureRoute);
            } else {
                gpStore.session.attempts++; logAction(`AUTH_FAILURE_ID_${gpStore.session.attempts}`); 
                alert("ACCESS DENIED: INCORRECT KEY"); navigate('gate');
            }
        }

        function renderShop(root) {
            let itemsHtml = gpStore.shop.length === 0 ? '<p style="text-align:center; opacity:0.5; font-size:12px;">Inventory empty.</p>' : '';
            gpStore.shop.forEach((item, idx) => {
                let imgTag = item.img ? `<img src="${item.img}" class="shop-img">` : `<div class="shop-img" style="display:flex;align-items:center;justify-content:center;color:#475569;font-size:10px;">PROCESSING VAULT DATA...</div>`;
                itemsHtml += `
                    <div class="shop-card">
                        ${imgTag}
                        <div style="padding: 15px;">
                            <h4 style="margin:0 0 5px 0; color:var(--g); font-size:14px; text-transform:uppercase;">${item.name}</h4>
                            <p style="font-size:10px; color:#94a3b8; margin:0 0 10px 0; height:30px; overflow:hidden;">${item.desc}</p>
                            <span style="display:block; font-weight:900; font-size:16px; margin-bottom:10px;">$${item.price}</span>
                            <button class="btn btn-primary btn-small" style="width:100%;" onclick="orderItem('${item.name}')">REQUEST ORDER</button>
                        </div>
                    </div>`;
            });
            root.innerHTML = `<div class="module"><span class="label">Public Requisition Protocol</span><div class="shop-grid">${itemsHtml}</div></div>`;
        }

        function orderItem(itemName) {
            if(gpStore.session.role !== 'client') {
                alert("You must log in to the Client Portal to request orders.");
                navigate('portal'); return;
            }
            sendMsg('client', gpStore.session.user, `AUTOMATED LOG: Requesting order for [${itemName}].`);
            alert("Order request transmitted to CEO.");
        }

        function renderPortal(root) {
            if(gpStore.session.role !== 'client') {
                root.innerHTML = `
                    <div class="module">
                        <span class="label">Client Uplink Terminal</span>
                        <input type="text" id="p-user" placeholder="ASSET ID">
                        <input type="password" id="p-pass" placeholder="SECURITY PIN">
                        <button class="btn btn-primary" onclick="userLogin('client')">ESTABLISH SECURE LINK</button>
                    </div>`;
            } else {
                const client = gpStore.clients.find(c => c.id === gpStore.session.user);
                const isPaid = client ? client.paid : false;
                const activePaymentLink = isPaid ? BASE_PAY_URL : DUE_PAY_URL;

                // Job Progress HTML (Phase System)
                let jobsHtml = client.jobs.length === 0 ? '<p style="font-size:11px; opacity:0.5;">No active production runs.</p>' : '';
                client.jobs.forEach(job => {
                    let phaseText = gpStore.phases[job.phaseIdx] || gpStore.phases[0];
                    let progressPercent = (job.phaseIdx / (gpStore.phases.length - 1)) * 100;
                    jobsHtml += `
                        <div style="margin-bottom: 15px;">
                            <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:900; color:var(--g);">
                                <span>${job.name}</span><span style="color:var(--o);">${phaseText}</span>
                            </div>
                            <div class="progress-container"><div class="progress-fill" style="width:${progressPercent}%"></div></div>
                        </div>`;
                });

                // Chat HTML
                let chatHtml = '';
                client.messages.forEach(m => {
                    chatHtml += `<div class="msg ${m.sender}"><span style="font-weight:900; color:${m.sender==='admin'?'var(--g)':'var(--o)'}">${m.sender === 'admin' ? 'CEO' : 'YOU'}</span><br>${m.text}<span class="msg-time">${m.time}</span></div>`;
                });

                root.innerHTML = `
                    <div class="module">
                        <span class="label">Asset Identity: Verified</span>
                        <h1 style="margin:10px 0; letter-spacing:2px; color:var(--g);">${gpStore.session.user}</h1>
                        <div class="progress-container"><div class="progress-fill" style="width:100%"></div></div>
                        <div class="stat-grid" style="margin-top:25px;">
                            <div class="stat-panel"><span class="label" style="font-size:8px;">Ledger Status</span><br><span style="color:${isPaid?'var(--g)':'var(--r)'}; font-weight:900;">${isPaid?'SETTLED':'DUE'}</span></div>
                            <div class="stat-panel"><span class="label" style="font-size:8px;">Network</span><br><span style="color:var(--b); font-weight:900;">SECURE</span></div>
                        </div>
                    </div>
                    
                    <div class="module">
                        <span class="label">Active Production</span>
                        ${jobsHtml}
                    </div>

                    <div class="module">
                        <span class="label" style="color:var(--o); border-color:var(--o);">Direct Comms Uplink</span>
                        <div class="chat-box" id="c-chatbox">${chatHtml}</div>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="c-msg-input" placeholder="Transmit message to CEO..." style="margin:0;">
                            <button class="btn btn-accent btn-small" onclick="sendMsg('client', '${client.id}')">SEND</button>
                        </div>
                    </div>

                    <div class="module">
                        <span class="label">Financial Infrastructure</span>
                        <a href="${activePaymentLink}" target="_blank" rel="noopener noreferrer" class="btn btn-accent" onclick="logAction('GATEWAY_HANDSHAKE_INIT')">INITIALIZE SQUARE CHECKOUT</a>
                        <button class="btn btn-danger" onclick="logout()" style="margin-top:30px;">TERMINATE ASSET SESSION</button>
                    </div>`;
                
                setTimeout(() => { const cb = document.getElementById('c-chatbox'); if(cb) cb.scrollTop = cb.scrollHeight; }, 100);
            }
        }

        // --- CREW PORTAL ---
        function renderCrew(root) {
            if(gpStore.session.role !== 'crew') {
                root.innerHTML = `
                    <div class="module" style="border-color:var(--o);">
                        <span class="label" style="color:var(--o);">Crew Uplink Terminal</span>
                        <input type="text" id="e-user" placeholder="OPERATIVE NAME">
                        <input type="password" id="e-pass" placeholder="SECURITY PIN">
                        <button class="btn btn-accent" onclick="userLogin('crew')">ENTER CREW UPLINK</button>
                    </div>`;
            } else {
                const emp = gpStore.employees.find(e => e.name === gpStore.session.user);
                let assignedJobs = '';
                
                gpStore.clients.forEach((c, cIdx) => {
                    c.jobs.forEach((j, jIdx) => {
                        if(j.assignedTo === emp.name) {
                            let phaseText = gpStore.phases[j.phaseIdx] || gpStore.phases[0];
                            assignedJobs += `
                                <div class="module" style="border-color:var(--b); padding:20px;">
                                    <span class="label" style="color:var(--b);">Client: ${c.name}</span>
                                    <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:900; align-items:center;">
                                        <span>Task: ${j.name}</span>
                                        <div style="display:flex; align-items:center; gap:10px;">
                                            <button class="btn btn-small btn-danger" style="margin:0;" onclick="shiftPhase(${cIdx}, ${jIdx}, -1)">◀</button>
                                            <span style="color:var(--o); min-width:80px; text-align:center;">${phaseText}</span>
                                            <button class="btn btn-small btn-accent" style="margin:0;" onclick="shiftPhase(${cIdx}, ${jIdx}, 1)">▶</button>
                                        </div>
                                    </div>
                                </div>`;
                        }
                    });
                });

                // Check active clock status
                const isClockedIn = gpStore.timeClock.length > 0 && gpStore.timeClock[0].emp === emp.name && gpStore.timeClock[0].type === 'CLOCK_IN' && !gpStore.timeClock[0].pairId;

                root.innerHTML = `
                    <div class="module">
                        <span class="label">Operative Identity: Verified</span>
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div>
                                <h1 style="margin:10px 0; letter-spacing:2px; color:var(--o);">${emp.name}</h1>
                                <p style="font-size:12px; color:#94a3b8;">Role: ${emp.role}</p>
                            </div>
                            <button class="btn ${isClockedIn ? 'btn-danger' : 'btn-accent'}" style="width:120px; font-size:10px;" onclick="toggleClock('${emp.name}', ${isClockedIn})">
                                ${isClockedIn ? 'CLOCK OUT' : 'CLOCK IN'}
                            </button>
                        </div>
                    </div>
                    ${assignedJobs || '<div class="module"><p style="opacity:0.5; font-size:11px;">No active processes assigned by CEO.</p></div>'}
                    <button class="btn btn-danger" onclick="logout()">TERMINATE SESSION</button>
                `;
            }
        }

        function toggleClock(empName, currentlyIn) {
            const time = new Date().toLocaleString();
            if(!currentlyIn) {
                gpStore.timeClock.unshift({emp: empName, type: 'CLOCK_IN', time: time, pairId: null});
                logAction(`TIMELOG: ${empName} CLOCKED IN`);
            } else {
                gpStore.timeClock.unshift({emp: empName, type: 'CLOCK_OUT', time: time, pairId: 'linked'});
                // Link to previous clock in
                let lastIn = gpStore.timeClock.find(t => t.emp === empName && t.type === 'CLOCK_IN' && !t.pairId);
                if(lastIn) lastIn.pairId = 'linked';
                logAction(`TIMELOG: ${empName} CLOCKED OUT`);
            }
            sync();
            navigate('crew');
        }

        function userLogin(roleType) {
            if(roleType === 'client') {
                const u = document.getElementById('p-user').value, p = document.getElementById('p-pass').value;
                const match = gpStore.clients.find(c => c.id === u && c.pin === p);
                if(match) { gpStore.session.user = u; gpStore.session.role = 'client'; logAction(`CLIENT_LOGIN:${u}`); navigate('portal'); } 
                else { alert("UNAUTHORIZED ASSET ID"); }
            } else if (roleType === 'crew') {
                const u = document.getElementById('e-user').value, p = document.getElementById('e-pass').value;
                const match = gpStore.employees.find(e => e.name === u && e.pin === p);
                if(match) { gpStore.session.user = u; gpStore.session.role = 'crew'; logAction(`CREW_LOGIN:${u}`); navigate('crew'); } 
                else { alert("UNAUTHORIZED OPERATIVE"); }
            }
        }

        function logout() { logAction("SESSION_TERMINATED"); gpStore.session.user = null; gpStore.session.role = null; navigate('portal'); }

        function renderAudit(root) {
            root.innerHTML = `
                <div class="module">
                    <span class="label">System Audit History</span>
                    <div class="ledger">
                        ${gpStore.session.log.map(entry => `<div class="entry"><span>${entry}</span></div>`).join('')}
                    </div>
                </div>
                <div class="module">
                    <span class="label">Kernel Telemetry</span>
                    <div class="stat-grid">
                        <div class="stat-panel"><span class="label" style="font-size:8px;">Uptime</span><br>100%</div>
                        <div class="stat-panel"><span class="label" style="font-size:8px;">Build</span><br>v45.3</div>
                    </div>
                </div>`;
        }

        function renderFunctionality(root) {
            root.innerHTML = `
                <div class="module">
                    <span class="label">Hardware Telemetry</span>
                    <div class="stat-grid">
                        <div class="stat-panel">
                            <span class="label" style="font-size:8px;">Core Processing</span><br>
                            <span style="font-weight:900; letter-spacing:1px;">MSI Thin 15</span><br>
                            <span style="color:var(--g); font-size:10px; font-weight:900;">ONLINE / STABLE</span>
                        </div>
                        <div class="stat-panel">
                            <span class="label" style="font-size:8px;">Storage Array</span><br>
                            <span style="font-weight:900; letter-spacing:1px;">Samsung SSD</span><br>
                            <span style="color:var(--g); font-size:10px; font-weight:900;">VMD CONFIGURED</span>
                        </div>
                    </div>
                </div>
                
                <div class="module" style="border-color: var(--o);">
                    <span class="label" style="color: var(--o); border-left-color: var(--o);">Live Production Routing</span>
                    <div class="ledger">
                        <div class="entry" style="flex-direction:column; align-items:flex-start;">
                            <div style="display:flex; justify-content:space-between; width:100%;">
                                <span style="color:#fff; font-weight:900; letter-spacing:1px;">Rustic Pine Coasters</span>
                                <span class="badge" style="background:rgba(249, 115, 22, 0.2); color:var(--o); border:1px solid var(--o);">IN PROGRESS</span>
                            </div>
                            <div class="progress-container" style="height:12px; margin:15px 0;"><div class="progress-fill" style="width:85%; background:linear-gradient(90deg, #f97316, #ffedd5); box-shadow: 0 0 15px rgba(249, 115, 22, 0.5);"></div></div>
                            <span style="font-size:11px; color:#94a3b8;">Current Phase: Edge Sanding & Raw Natural Finish</span>
                        </div>
                        <div class="entry" style="flex-direction:column; align-items:flex-start;">
                            <div style="display:flex; justify-content:space-between; width:100%;">
                                <span style="color:#fff; font-weight:900; letter-spacing:1px;">Client Drop: The Leafy Lounge</span>
                                <span class="badge" style="background:rgba(0, 132, 255, 0.2); color:var(--b); border:1px solid var(--b);">PENDING</span>
                            </div>
                            <span style="font-size:12px; margin-top:12px; line-height:1.5; border-left: 2px solid var(--b); padding-left: 15px; color:#94a3b8;">
                                <strong>ETA:</strong> Week of May 4th<br>
                                <strong>Action Item:</strong> Deliver custom wood items and updated price sheet to shop owners.
                            </span>
                        </div>
                    </div>
                </div>`;
        }

        // --- CEO GARD ---
        function renderAdmin(root) {
            const paid = gpStore.clients.filter(c => c.paid).length;
            const totalRev = (paid * gpStore.meta.subCost) + gpStore.meta.manualCredits;
            const progress = Math.min((totalRev / 10000) * 100, 100);
            
            let clientOptions = gpStore.clients.map((c, i) => `<option value="${i}">${c.name} (${c.id})</option>`).join('');
            let empOptions = '<option value="Unassigned">Unassigned</option>' + gpStore.employees.map(e => `<option value="${e.name}">${e.name}</option>`).join('');

            let crewList = gpStore.employees.map((e, i) => `
                <div class="entry" style="flex-direction:column; align-items:flex-start; padding:15px; background:rgba(0,0,0,0.3); border-radius:10px; margin-bottom:10px;">
                    <div style="display:flex; justify-content:space-between; width:100%;">
                        <strong style="color:var(--g); font-size:14px;">${e.name}</strong>
                        <button class="btn btn-danger btn-small" onclick="fireCrew(${i})">REVOKE</button>
                    </div>
                    <span style="font-size:10px; color:#94a3b8; margin:5px 0;">ROLE: ${e.role}</span>
                    <div style="display:flex; gap:10px; width:100%; margin-top:10px;">
                        <input type="text" id="upd-pin-${i}" value="${e.pin}" placeholder="PIN" style="margin:0; padding:10px; font-size:12px; flex:2;">
                        <button class="btn btn-accent btn-small" style="flex:1;" onclick="updateEmpPin(${i})">Update PIN</button>
                    </div>
                </div>`).join('');

            let phaseList = gpStore.phases.map((p, i) => `
                <div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:11px; padding:5px; background:rgba(255,255,255,0.05); border-radius:5px;">
                    <span>${i+1}. ${p}</span> <span style="color:var(--r); cursor:pointer;" onclick="deletePhase(${i})">X</span>
                </div>
            `).join('');

            let timeLogs = gpStore.timeClock.map(t => `
                <div style="border-bottom:1px solid #222; padding:5px 0; font-size:11px;">
                    <strong style="color:${t.type==='CLOCK_IN'?'var(--g)':'var(--o)'}">${t.type}</strong> - ${t.emp} <br>
                    <span style="opacity:0.5;">${t.time}</span>
                </div>
            `).join('');

            root.innerHTML = `
                <h2 style="color:var(--g); text-align:center; letter-spacing:5px; margin-bottom:40px; text-shadow:var(--neon);">CEO COMMAND CENTER</h2>
                
                <div class="module">
                    <span class="label">Revenue Scaling Dashboard</span>
                    <h1 style="color:var(--g); margin:15px 0; font-size:56px; text-shadow:var(--neon);">$${totalRev.toFixed(2)}</h1>
                    <div class="progress-container"><div class="progress-fill" style="width:${progress}%"></div></div>
                    <p style="text-align:right; font-size:10px; opacity:0.5; letter-spacing:2px;">QUOTA: $10,000.00</p>
                </div>

                <div class="module" style="border-color:var(--b);">
                    <span class="label" style="color:var(--b);">Time & Attendance Ledger</span>
                    <div class="ledger" style="max-height:150px;">${timeLogs || '<p style="opacity:0.5; font-size:11px;">No logs recorded.</p>'}</div>
                </div>

                <div class="module" style="border-color:var(--o);">
                    <span class="label" style="color:var(--o);">Crew Management</span>
                    <input type="text" id="ne-n" placeholder="OPERATIVE NAME">
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="ne-r" placeholder="SPECIALTY (e.g. Sander)" style="flex:2;">
                        <input type="text" id="ne-p" placeholder="PIN" style="flex:1;">
                    </div>
                    <button class="btn btn-accent" onclick="addCrew()">HIRE OPERATIVE</button>
                    <div class="ledger" style="margin-top:20px; background:transparent; border:none; padding:0;">
                        ${crewList || '<p style="opacity:0.5; font-size:11px;">No active personnel.</p>'}
                    </div>
                </div>

                <div class="module">
                    <span class="label">Custom Status Matrices</span>
                    <p style="font-size:10px; color:#94a3b8;">Define the sequential progress phases for your jobs.</p>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="new-phase-name" placeholder="E.g. On Lunch, Sanding, Polishing">
                        <button class="btn btn-primary btn-small" onclick="addPhase()">ADD</button>
                    </div>
                    <div style="margin-top:15px; max-height:150px; overflow-y:auto;">${phaseList}</div>
                </div>

                <div class="module">
                    <span class="label">Production Progress Controller</span>
                    <select id="job-client-sel" style="background:#0f172a;">${clientOptions || '<option>NO CLIENTS DETECTED</option>'}</select>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <input type="text" id="new-job-name" placeholder="NEW TASK NAME" style="flex:1; min-width:200px;">
                        <select id="job-emp-sel" style="background:#0f172a; flex:1; min-width:150px;">${empOptions}</select>
                        <button class="btn btn-primary btn-small" style="flex:1;" onclick="assignJob()">ASSIGN</button>
                    </div>
                    <div id="admin-job-list" style="margin-top:20px;"></div>
                </div>

                <div class="module" style="border-color:var(--g);">
                    <span class="label">Shop Data Vault Injection</span>
                    <p style="font-size:10px; color:var(--b); margin-bottom:10px;">NOTE: High-res images are now routed directly to the IndexedDB Data Vault to bypass standard limits.</p>
                    <input type="text" id="s-name" placeholder="PRODUCT DESIGNATION">
                    <input type="text" id="s-desc" placeholder="TECHNICAL DESCRIPTION">
                    <input type="number" id="s-price" placeholder="PRICE ($)">
                    <input type="file" id="s-img" accept="image/*">
                    <button class="btn btn-primary" onclick="injectShop()">PUSH TO PUBLIC GRID</button>
                </div>

                <div class="module">
                    <span class="label" style="color:var(--o); border-color:var(--o);">Command Comms</span>
                    <select id="msg-client-sel" style="background:#0f172a;" onchange="loadAdminChat()">${clientOptions || '<option>NO CLIENTS</option>'}</select>
                    <div class="chat-box" id="a-chatbox" style="height: 150px;"></div>
                    <div style="display:flex; gap:10px;">
                        <input type="text" id="a-msg-input" placeholder="Transmit reply..." style="margin:0;">
                        <button class="btn btn-primary btn-small" onclick="sendAdminMsg()">SEND</button>
                    </div>
                </div>

                <div class="module">
                    <span class="label">Client Identity Management</span>
                    <input type="text" id="new-name" placeholder="LEGAL ASSET NAME">
                    <div style="display:flex; gap:15px;">
                        <input type="text" id="new-id" placeholder="UID"><input type="password" id="new-pin" placeholder="PIN">
                    </div>
                    <button class="btn btn-accent" onclick="addClient()">REGISTER NEW CLIENT</button>
                    <div class="ledger" style="margin-top:30px;">
                        ${gpStore.clients.map((c, i) => `
                            <div class="entry">
                                <span style="font-weight:900;">${c.name}</span>
                                <div style="display:flex; gap:15px;">
                                    <span class="badge" style="background:${c.paid ? 'rgba(0,242,255,0.15)' : 'rgba(255,59,59,0.1)'}; color:${c.paid ? 'var(--g)' : 'var(--r)'}; border:1px solid ${c.paid ? 'var(--g)' : 'var(--r)'}" onclick="togglePaid(${i})">${c.paid ? 'SETTLED' : 'DUE'}</span>
                                    <span style="color:var(--r); cursor:pointer; font-weight:900;" onclick="killClient(${i})">PURGE</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="module" style="border-color:var(--b);">
                    <span class="label" style="color:var(--b)">Hardware & Inventory Asset Ledger</span>
                    <input type="text" id="inv-n" placeholder="ITEM CLASSIFICATION">
                    <textarea id="inv-s" placeholder="TECHNICAL SPECIFICATIONS (Laser Speed, Power, Material Grade...)" rows="4"></textarea>
                    <button class="btn btn-primary" onclick="addInv()">LOG PRODUCTION ASSET</button>
                    <div class="ledger" style="margin-top:30px;">
                        ${gpStore.inventory.map((item, i) => `
                            <div class="entry" style="flex-direction:column; align-items:flex-start;">
                                <div style="display:flex; justify-content:space-between; width:100%;">
                                    <span style="color:var(--g); font-weight:900; letter-spacing:1px;">${item.n}</span>
                                    <span style="color:var(--r); cursor:pointer; font-size:11px;" onclick="killInv(${i})">WIPE_DATA</span>
                                </div>
                                <span style="font-size:12px; opacity:0.6; margin-top:12px; line-height:1.5; border-left: 2px solid var(--b); padding-left: 15px;">${item.s}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="module">
                    <span class="label">Precision Quote Engine (Logic v43.2)</span>
                    <div style="display:flex; gap:15px;">
                        <div style="flex:1;"><span class="label" style="font-size:9px;">Design Count</span><input type="number" id="q-d" value="1"></div>
                        <div style="flex:1;"><span class="label" style="font-size:9px;">Unit Total</span><input type="number" id="q-u" value="12"></div>
                    </div>
                    <div id="q-output" style="text-align:center; font-size:42px; font-weight:900; color:var(--g); padding:30px 0; text-shadow:var(--neon);">ESTIMATE: $47.00</div>
                    <button class="btn btn-accent" onclick="runQuote()">RECALCULATE ESTIMATE</button>
                </div>

                <div class="module">
                    <span class="label">Manual Ledger Credit Injection</span>
                    <input type="number" id="cash-in" placeholder="CREDIT VALUE IN USD ($)">
                    <button class="btn btn-accent" onclick="injectCash()">AUTHORIZE DEPOSIT</button>
                </div>
                <button class="btn btn-danger" onclick="sysUnlocked=false; navigate('portal')">LOCK SYSTEM AND TERMINATE COMMAND SESSION</button>`;
                
            const jobSel = document.getElementById('job-client-sel');
            if(jobSel) { jobSel.addEventListener('change', loadAdminJobs); loadAdminJobs(); }
            if(document.getElementById('msg-client-sel')) loadAdminChat();
        }

        // CEO FUNCTIONS
        function addCrew() {
            const n = document.getElementById('ne-n').value, r = document.getElementById('ne-r').value, p = document.getElementById('ne-p').value;
            if(n) { gpStore.employees.push({name: n, role: r || 'Operative', task: '', pin: p || '0000'}); logAction(`HIRED:${n}`); sync(); navigate('admin'); }
        }
        function fireCrew(i) { logAction(`FIRED:${gpStore.employees[i].name}`); gpStore.employees.splice(i,1); sync(); navigate('admin'); }
        function updateEmpPin(i) {
            const newPin = document.getElementById(`upd-pin-${i}`).value;
            gpStore.employees[i].pin = newPin; logAction(`PIN_UPDATED:${gpStore.employees[i].name}`); sync(); alert("Operative PIN updated.");
        }

        function addPhase() {
            const p = document.getElementById('new-phase-name').value;
            if(p) { gpStore.phases.push(p); logAction(`PHASE_ADDED:${p}`); sync(); navigate('admin'); }
        }
        function deletePhase(i) {
            if(gpStore.phases.length > 1) { gpStore.phases.splice(i, 1); sync(); navigate('admin'); }
            else { alert("Cannot delete the final phase."); }
        }

        function injectShop() {
            const n = document.getElementById('s-name').value, d = document.getElementById('s-desc').value, p = document.getElementById('s-price').value;
            const file = document.getElementById('s-img').files[0];
            if(!n || !p) { alert("Name and Price required."); return; }
            
            if(file) {
                const reader = new FileReader();
                reader.onloadend = function() { 
                    const imgId = "img_" + Date.now();
                    savePhotoToVault(imgId, reader.result); // Push base64 string directly into IndexedDB Vault
                    gpStore.shop.push({name: n, desc: d, price: p, imgId: imgId}); // Save only ID in localStore to save space
                    logAction(`SHOP_ADD:${n}`); sync(); navigate('admin'); 
                }
                reader.readAsDataURL(file);
            } else { gpStore.shop.push({name: n, desc: d, price: p, imgId: null}); logAction(`SHOP_ADD:${n}`); sync(); navigate('admin'); }
        }

        function addClient() {
            const n = document.getElementById('new-name').value, i = document.getElementById('new-id').value, p = document.getElementById('new-pin').value;
            if(n && i && p) { gpStore.clients.push({name: n, id: i, pin: p, paid: false, jobs: [], messages: []}); logAction(`CLIENT_REGISTRATION:${n}`); sync(); navigate('admin'); }
        }
        function togglePaid(i) { gpStore.clients[i].paid = !gpStore.clients[i].paid; logAction(`STATUS_SHIFT:${gpStore.clients[i].name}`); sync(); navigate('admin'); }
        function killClient(i) { if(confirm("Purge Asset Data?")) { logAction(`DATA_WIPE:${gpStore.clients[i].name}`); gpStore.clients.splice(i,1); sync(); navigate('admin'); } }
        
        function addInv() {
            const n = document.getElementById('inv-n').value, s = document.getElementById('inv-s').value;
            if(n && s) { gpStore.inventory.push({n: n, s: s}); logAction(`ASSET_LOGGED:${n}`); sync(); navigate('admin'); }
        }
        function killInv(i) { logAction(`ASSET_PURGED:${gpStore.inventory[i].n}`); gpStore.inventory.splice(i,1); sync(); navigate('admin'); }

        function loadAdminJobs() {
            const sel = document.getElementById('job-client-sel');
            const list = document.getElementById('admin-job-list');
            if(!sel || sel.options.length === 0 || !list) return;
            
            const cIdx = sel.value;
            const client = gpStore.clients[cIdx];
            let h = '';
            client.jobs.forEach((j, jIdx) => {
                let phaseText = gpStore.phases[j.phaseIdx] || gpStore.phases[0];
                h += `
                    <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:10px; margin-bottom:10px;">
                        <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:900;">
                            <span>${j.name} <span style="color:var(--o);">[${j.assignedTo || 'Unassigned'}]</span></span>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px; margin: 10px 0;">
                            <button class="btn btn-small btn-danger" style="margin:0;" onclick="shiftPhase(${cIdx}, ${jIdx}, -1)">◀</button>
                            <span style="color:var(--o); min-width:80px; text-align:center; font-size:12px; font-weight:900;">${phaseText}</span>
                            <button class="btn btn-small btn-accent" style="margin:0;" onclick="shiftPhase(${cIdx}, ${jIdx}, 1)">▶</button>
                        </div>
                        <button class="btn btn-danger btn-small" style="width:100%; margin-top:5px;" onclick="deleteJob(${cIdx}, ${jIdx})">DELETE JOB</button>
                    </div>`;
            });
            list.innerHTML = h;
        }

        function assignJob() {
            const sel = document.getElementById('job-client-sel');
            const task = document.getElementById('new-job-name').value;
            const emp = document.getElementById('job-emp-sel').value;
            if(!sel || !task) return;
            gpStore.clients[sel.value].jobs.push({name: task, progress: 0, phaseIdx: 0, assignedTo: emp}); logAction(`JOB_ADDED:${task}`); sync(); loadAdminJobs(); document.getElementById('new-job-name').value = '';
        }

        function shiftPhase(cIdx, jIdx, direction) {
            let maxPhase = gpStore.phases.length - 1;
            let current = gpStore.clients[cIdx].jobs[jIdx].phaseIdx;
            
            if (direction === 1 && current < maxPhase) current++;
            if (direction === -1 && current > 0) current--;

            gpStore.clients[cIdx].jobs[jIdx].phaseIdx = current;
            gpStore.clients[cIdx].jobs[jIdx].progress = Math.round((current / maxPhase) * 100);
            
            logAction(`PHASE_UPDATE:${gpStore.clients[cIdx].jobs[jIdx].name} -> ${gpStore.phases[current]}`);
            sync(); 
            
            if(currentActiveScreen === 'admin') loadAdminJobs();
            if(currentActiveScreen === 'crew') navigate('crew');
        }

        function deleteJob(cIdx, jIdx) { gpStore.clients[cIdx].jobs.splice(jIdx, 1); sync(); loadAdminJobs(); }

        // Chat logic
        function sendMsg(sender, clientId, forcedText = null) {
            let text = forcedText || document.getElementById(sender === 'admin' ? 'a-msg-input' : 'c-msg-input').value;
            if(!text) return;
            let client = gpStore.clients.find(c => c.id === clientId);
            client.messages.push({sender: sender, text: text, time: new Date().toLocaleTimeString()});
            sync();
            if(sender === 'client') navigate('portal');
        }
        
        function sendAdminMsg() {
            const sel = document.getElementById('msg-client-sel');
            if(!sel) return;
            sendMsg('admin', gpStore.clients[sel.value].id);
            document.getElementById('a-msg-input').value = '';
            loadAdminChat();
        }

        function loadAdminChat() {
            const sel = document.getElementById('msg-client-sel');
            const cb = document.getElementById('a-chatbox');
            if(!sel || sel.options.length===0 || !cb) return;
            const client = gpStore.clients[sel.value];
            let h = '';
            client.messages.forEach(m => {
                h += `<div class="msg ${m.sender}" style="max-width:90%;"><span style="font-weight:900; color:${m.sender==='admin'?'var(--g)':'var(--o)'}">${m.sender === 'admin' ? 'CEO' : 'CLIENT'}</span>: ${m.text} <span class="msg-time">${m.time}</span></div>`;
            });
            cb.innerHTML = h || '<p style="opacity:0.5; font-size:11px;">No comms history.</p>';
            cb.scrollTop = cb.scrollHeight;
        }

        function runQuote() {
            const d = parseFloat(document.getElementById('q-d').value) || 0, u = parseFloat(document.getElementById('q-u').value) || 0;
            const res = (d * 5) + (u * 3.50);
            document.getElementById('q-output').innerText = "ESTIMATE: $" + res.toFixed(2);
            logAction(`QUOTE_ENGINE_RUN:${res.toFixed(2)}`);
        }

        function injectCash() {
            const amt = parseFloat(document.getElementById('cash-in').value);
            if(amt) { gpStore.meta.manualCredits += amt; logAction(`MANUAL_CREDIT_INJECT:${amt}`); sync(); navigate('admin'); }
        }
    </script>
</body>
</html>
